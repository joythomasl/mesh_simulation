<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesh Simulation</title>
<meta name="description" content="Interactive simulation of how phones talk to each other when the network is down: a group with no leader, how messages find their way, voice, photos, the LoRa radio link, satellite backup, signal returning, warnings into a dead zone, urgent messages first, and a group that splits.">
<script>(function(){var t=null;try{t=localStorage.getItem("rl_theme");}catch(e){}if(t!=="dark"&&t!=="light"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 22c6-9 20-9 26 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="6" cy="20" r="2.4" fill="currentColor"/><circle cx="16" cy="15.4" r="2.4" fill="currentColor"/><circle cx="26" cy="20" r="2.4" fill="currentColor"/><path d="M6 20l10-4.6L26 20" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/></svg>
    <span><b>Mesh Simulation</b><small>How phones talk when the network is down</small></span>
  </a>
  <span class="sp"></span>
  <div class="speed" role="group" aria-label="Simulation speed">
    <span class="speed-lbl">Speed</span>
    <button type="button" id="btn-pause" class="tb" title="Pause / play">⏸</button>
    <button type="button" class="tb spd" data-s="1">1×</button>
    <button type="button" class="tb spd on" data-s="3">3×</button>
    <button type="button" class="tb spd" data-s="10">10×</button>
    <span class="clock mono" id="clock">t = 0.0 s</span>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle"></button>
</header>

<div class="shell">
  <aside class="scenarios" id="scenarios" aria-label="Scenarios"></aside>

  <main class="stage">
    <div class="stage-head">
      <div>
        <div class="eyebrow" id="sc-tier"></div>
        <h1 id="sc-title"></h1>
        <p class="blurb" id="sc-blurb"></p>
      </div>
      <button type="button" class="btn" id="btn-reset">↺ Start over</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="net" width="960" height="560" aria-label="Network simulation canvas"></canvas>
      <div class="tools" id="tools" hidden></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="narration">
      <div class="steps" id="steps"></div>
      <div class="narr-text" id="narr"></div>
      <div class="narr-actions">
        <button type="button" class="btn primary" id="btn-next">Start →</button>
        <label class="auto"><input type="checkbox" id="auto-run"> play by itself</label>
      </div>
    </div>
  </main>

  <aside class="side">
    <section class="panel">
      <div class="panel-title">Try it</div>
      <div class="panel-body" id="controls"></div>
    </section>
    <section class="panel">
      <div class="panel-title">The numbers</div>
      <div class="panel-body metrics" id="metrics"></div>
    </section>
    <section class="panel grow">
      <div class="panel-title">What happened <span class="sub" id="log-cnt"></span></div>
      <div class="log" id="log"></div>
    </section>
  </aside>
</div>

<script src="sim.js"></script>
</body>
</html>
